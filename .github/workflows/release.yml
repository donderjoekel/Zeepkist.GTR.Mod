name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

env:
  GAME_ID: 3213
  MOD_ID: 2948039

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Stable releases are tagged major.minor.patch (pre-releases use a v-prefixed -alpha/-beta/-rc label)
          previous=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
          if [ -z "$previous" ]; then
            echo "::error::No stable release tag found to bump from"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$previous"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump type '$BUMP'"; exit 1 ;;
          esac
          version="$major.$minor.$patch"

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::Tag $version already exists"
            exit 1
          fi

          echo "Bumping $previous -> $version ($BUMP)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Detect csproj
        id: csproj
        uses: ./.github/actions/detect-csproj

      - name: Set CSProj Version
        uses: KageKirin/set-csproj-version@d450aed0cc1a1e9d04c47d017a59c05287202007 # v1.0.0
        with:
          file: ${{ steps.csproj.outputs.csproj_name }}.csproj
          version: ${{ env.VERSION }}

      - name: Publish
        run: dotnet publish --artifacts-path "C:\out"

      - name: Get AssemblyName
        id: asm
        uses: ./.github/actions/get-assembly-name
        with:
          csproj: ${{ steps.csproj.outputs.csproj_name }}

      - name: Remove msstore source
        run: winget source remove msstore

      - name: Install Mono
        run: winget install -e --id Mono.Mono --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: PDB2MDB
        shell: cmd
        run: >
          "C:\Program Files\Mono\bin\pdb2mdb.bat"
          "C:\out\publish\${{ steps.csproj.outputs.csproj_name }}\debug\${{ steps.asm.outputs.assembly_name }}.dll"

      - name: Zip build
        shell: pwsh
        run: |
          $src = "C:\out\publish\${{ steps.csproj.outputs.csproj_name }}\debug"
          $dst = "C:\out\build-${{ env.VERSION }}.zip"
          if (Test-Path $dst) { Remove-Item $dst -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $dst -Force

      - name: Create tag and GitHub release
        id: gh_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $zip = "C:\out\Zeepkist.GTR.Mod-$env:VERSION.zip"
          Copy-Item "C:\out\build-$env:VERSION.zip" $zip
          gh release create $env:VERSION $zip `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title $env:VERSION `
            --notes-start-tag $env:PREVIOUS `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $body = gh release view $env:VERSION --repo "${{ github.repository }}" --json body --jq .body | Out-String
          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $body.TrimEnd() >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Upload mod to mod.io
        uses: Thundernerd/upload-mod-to-modio@306d470f2b096a40315bfda2e4cb39c7ef9e4de4 # v1.0.0
        with:
          bearer-token: ${{ secrets.MODIO_BEARER }}
          game-id: ${{ env.GAME_ID }}
          mod-id: ${{ env.MOD_ID }}
          active: true
          changelog: ${{ steps.gh_release.outputs.body }}
          file-path: 'C:\out\build-${{ env.VERSION }}.zip'
          version: ${{ env.VERSION }}
