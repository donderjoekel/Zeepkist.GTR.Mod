name: Version Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  version-unchanged:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Ensure version was not edited manually
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The release workflow derives the version from git tags, so PRs must not touch it
          changes=$(git diff "$BASE_SHA...$HEAD_SHA" -- '*.csproj' '*.props' '*.targets' \
            | grep -E '^[+-][[:space:]]*<(Version|VersionPrefix|VersionSuffix|AssemblyVersion|FileVersion|InformationalVersion)>' \
            || true)

          if [ -n "$changes" ]; then
            echo "::error::This PR changes the mod version. Versions are bumped by the release workflow (Actions > release > Run workflow); revert these lines:"
            echo "$changes"
            exit 1
          fi

          echo "Version untouched."
