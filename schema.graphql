"An object with a globally unique `ID`."
interface Node {
  "A globally unique identifier. Can be used in various places throughout the system to identify this single value."
  nodeId: ID!
}

type RecordMedia implements Node {
  "A globally unique identifier. Can be used in various places throughout the system to identify this single value."
  nodeId: ID!
  recordId: Int!
  ghostUrl: String
  dateCreated: Datetime!
  dateUpdated: Datetime
  "Reads a single `Record` that is related to this `RecordMedia`."
  record: Record
}

"A point in time as described by the [ISO\n8601](https:\/\/en.wikipedia.org\/wiki\/ISO_8601) and, if it has a timezone, [RFC\n3339](https:\/\/datatracker.ietf.org\/doc\/html\/rfc3339) standards. Input values\nthat do not conform to both ISO 8601 and RFC 3339 may be coerced, which may lead\nto unexpected results."
scalar Datetime

type Record implements Node {
  "A globally unique identifier. Can be used in various places throughout the system to identify this single value."
  nodeId: ID!
